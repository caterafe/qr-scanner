<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a5f4a" />
  <title>확인자 QR 스캐너</title>
  <style>
    :root { --primary:#1a5f4a; --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px); }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;background:#0f172a;color:#fff;min-height:100dvh;padding:calc(16px + var(--safe-top)) 16px calc(16px + var(--safe-bottom));}
    .wrap{max-width:420px;margin:0 auto}
    h1{font-size:1.1rem;font-weight:700;margin-bottom:6px;color:#a7f3d0}
    p.sub{font-size:.85rem;color:#94a3b8;margin-bottom:14px}
    .card{background:#111827;border:1px solid #1f2937;border-radius:12px;padding:12px;margin-bottom:12px}
    .input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid #334155;background:#0b1220;color:#fff;margin-bottom:8px}
    .btn{width:100%;padding:12px 14px;border:none;border-radius:10px;font-size:.95rem;font-weight:600;cursor:pointer;background:var(--primary);color:#fff}
    .btn.sub{background:#334155;margin-top:6px}
    .frame-wrap{position:relative;width:min(90vw,320px);aspect-ratio:1;border-radius:16px;overflow:hidden;border:3px solid #1a5f4a;background:#000;margin:0 auto}
    video{display:block;width:100%;height:100%;object-fit:cover}
    .corner{position:absolute;width:28px;height:28px;border-color:#fff;border-style:solid;border-width:0;opacity:.9}
    .tl{top:14px;left:14px;border-top-width:3px;border-left-width:3px}.tr{top:14px;right:14px;border-top-width:3px;border-right-width:3px}
    .bl{bottom:14px;left:14px;border-bottom-width:3px;border-left-width:3px}.br{bottom:14px;right:14px;border-bottom-width:3px;border-right-width:3px}
    .scan-line{position:absolute;left:14px;right:14px;height:2px;background:linear-gradient(to right,transparent,#34d399,transparent);animation:scanMove 2s ease-in-out infinite}
    @keyframes scanMove{0%{top:14px}50%{top:calc(100% - 14px)}100%{top:14px}}
    #status{margin-top:12px;font-size:.9rem;color:#94a3b8;min-height:2.4em;white-space:pre-line}
    #status.ok{color:#34d399} #status.err{color:#f87171}
    #result{margin-top:12px;display:none}
    .pill{display:inline-block;padding:6px 12px;border-radius:999px;font-size:1rem;font-weight:700}
    .pill.pending{background:#fef3c7;color:#92400e}.pill.done{background:#d1fae5;color:#065f46}
    .kv{margin:8px 0;color:#e5e7eb;font-size:1.08rem;line-height:1.55}
    .kv strong{font-size:1.28rem;color:#ffffff}
    canvas{display:none}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>확인자 QR 스캐너</h1>
    <p class="sub">로그인 후 학생 QR을 스캔하고 지급 처리하세요.</p>

    <div class="card" id="loginCard">
      <input id="loginId" class="input" placeholder="확인자 아이디" />
      <input id="loginPw" class="input" placeholder="확인자 비밀번호" type="password" />
      <button id="loginBtn" class="btn">로그인</button>
      <button id="logoutBtn" class="btn sub">로그아웃</button>
    </div>

    <div class="frame-wrap">
      <video id="video" playsinline webkit-playsinline muted autoplay></video>
      <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
      <div class="scan-line" id="scanLine"></div>
    </div>
    <canvas id="canvas"></canvas>

    <div id="status">카메라를 시작하는 중…</div>
    <button id="retryBtn" class="btn" style="display:none;margin-top:10px;">다시 시도</button>

    <div id="result" class="card">
      <div class="kv">학번: <strong id="rStudent"></strong></div>
      <div class="kv">성명: <strong id="rName"></strong></div>
      <div class="kv">등수: <strong id="rPrize"></strong></div>
      <div class="kv">상태: <span id="rDelivered"></span></div>
      <button id="markBtn" class="btn">지급처리</button>
      <button id="nextBtn" class="btn sub">다음 스캔</button>
    </div>
  </div>

<script>
  var jsQrReady=false,pendingStart=false;
  var GAS_URL='https://script.google.com/macros/s/AKfycbwBnusLQOgg5KT4XdDSW3_7NKkHhNcl2TRZe0BYoPToEuk4Hs-VqH1A9XUAitJm9yKsOQ/exec';
  var SESSION_TOKEN='',CURRENT_TOKEN='';
  var video=document.getElementById('video');
  var canvas=document.getElementById('canvas');
  var ctx=canvas.getContext('2d');
  var rafId=0,stream=null,scanned=false,lastScan='';

  (function(){
    var s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js';
    s.onload=function(){jsQrReady=true;if(pendingStart)beginDecode();};
    s.onerror=function(){setStatus('QR 라이브러리 로드 실패','err');};
    document.head.appendChild(s);
  })();

  function setStatus(msg,cls){var e=document.getElementById('status');e.textContent=msg;e.className=cls||'';}
  function saveLocal(){localStorage.setItem('verifier_login_id',document.getElementById('loginId').value||'');}
  function loadLocal(){document.getElementById('loginId').value=localStorage.getItem('verifier_login_id')||'';}

  function jsonp(params){
    return new Promise(function(resolve,reject){
      if(!GAS_URL || GAS_URL.indexOf('REPLACE_WITH_YOUR_DEPLOYMENT_ID') >= 0){reject(new Error('코드의 GAS_URL을 실제 웹앱 URL로 바꿔 주세요.'));return;}
      var cb='cb_'+Date.now()+'_'+Math.floor(Math.random()*10000);
      window[cb]=function(data){cleanup();resolve(data);};
      var q=[]; Object.keys(params).forEach(function(k){q.push(encodeURIComponent(k)+'='+encodeURIComponent(params[k]));});
      q.push('api=1'); q.push('callback='+encodeURIComponent(cb));
      var s=document.createElement('script');
      s.src=GAS_URL+(GAS_URL.indexOf('?')>=0?'&':'?')+q.join('&');
      s.onerror=function(){cleanup();reject(new Error('API 호출 실패'));};
      document.body.appendChild(s);
      function cleanup(){try{delete window[cb];}catch(e){} if(s.parentNode)s.parentNode.removeChild(s);}    
    });
  }

  function parseQrPayload(raw){
    var t=String(raw||'').trim();
    var out={token:'',studentId:'',studentName:'',prize:''};
    if(!t) return out;
    var m=t.match(/[?&]v=([^&\s#]+)/i);
    if(m) out.token=safeDecode(m[1]);
    var sid=t.match(/[?&]sid=([^&\s#]+)/i);
    var sn=t.match(/[?&]sn=([^&\s#]+)/i);
    var pr=t.match(/[?&]pr=([^&\s#]+)/i);
    if(sid) out.studentId=safeDecode(sid[1]);
    if(sn) out.studentName=safeDecode(sn[1]);
    if(pr) out.prize=safeDecode(pr[1]);
    if(!out.token && /^[0-9a-f-]{36}$/i.test(t)) out.token=t;
    return out;
  }

  function safeDecode(v){
    try{return decodeURIComponent(v);}catch(e){return v;}
  }

  function startCamera(){
    document.getElementById('retryBtn').style.display='none';
    scanned=false; document.getElementById('scanLine').style.display='block';
    if(stream){stream.getTracks().forEach(function(t){t.stop();});stream=null;}
    cancelAnimationFrame(rafId);
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){setStatus('이 브라우저는 카메라를 지원하지 않습니다.','err');return;}
    setStatus('카메라 권한 요청 중…');
    var constraints=[
      {video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false},
      {video:{facingMode:{ideal:'environment'}},audio:false},
      {video:{facingMode:'environment'},audio:false},
      {video:true,audio:false}
    ];
    (function tryNext(i,lastErr){
      if(i>=constraints.length){onCamErr(lastErr||new Error('카메라 시작 실패'));return;}
      navigator.mediaDevices.getUserMedia(constraints[i]).then(onStream).catch(function(e){tryNext(i+1,e);});
    })(0);
  }

  function onStream(s){
    stream=s; video.srcObject=s;
    video.play().then(function(){setStatus('QR을 화면 안에 맞춰 주세요'); if(jsQrReady)beginDecode(); else pendingStart=true;})
      .catch(onCamErr);
  }

  function onCamErr(err){
    var n=err&&err.name?err.name:'';
    setStatus('카메라 오류: '+(n||err.message||'알 수 없음'),'err');
    document.getElementById('retryBtn').style.display='block';
  }

  function beginDecode(){
    if(!jsQrReady) return;
    (function tick(){
      rafId=requestAnimationFrame(tick);
      if(scanned||video.readyState<2) return;
      var w=video.videoWidth,h=video.videoHeight; if(!w||!h) return;
      canvas.width=w; canvas.height=h; ctx.drawImage(video,0,0,w,h);
      var img=ctx.getImageData(0,0,w,h);
      var code=jsQR(img.data,w,h,{inversionAttempts:'dontInvert'});
      if(code&&code.data) handleQr(code.data);
    })();
  }

  function handleQr(raw){
    var payload=parseQrPayload(raw);
    var token=payload.token;
    if(!token || token===lastScan) return;
    lastScan=token; CURRENT_TOKEN=token; scanned=true;
    cancelAnimationFrame(rafId);
    document.getElementById('scanLine').style.display='none';
    showResult({
      studentId: payload.studentId || '(QR 포함값 없음)',
      studentName: payload.studentName || '',
      prize: payload.prize || '(QR 포함값 없음)',
      delivered: false
    });
    setStatus('스캔 완료. 지급처리를 눌러 기록하세요.','ok');
  }

  function showResult(res){
    document.getElementById('result').style.display='block';
    document.getElementById('rStudent').textContent=res.studentId||'';
    document.getElementById('rName').textContent=res.studentName||'';
    document.getElementById('rPrize').textContent=res.prize||'';
    var d=document.getElementById('rDelivered');
    if(res.delivered){
      d.innerHTML='<span class="pill done">지급완료</span>';
      document.getElementById('markBtn').style.display='none';
    }else{
      d.innerHTML='<span class="pill pending">미지급</span>';
      document.getElementById('markBtn').style.display='block';
    }
  }

  document.getElementById('loginBtn').onclick=function(){
    var id=document.getElementById('loginId').value.trim();
    var pw=document.getElementById('loginPw').value;
    if(!id||!pw){setStatus('아이디/비밀번호를 입력해 주세요.','err');return;}
    saveLocal();
    setStatus('로그인 중…');
    jsonp({action:'loginVerifier',loginId:id,loginPw:pw}).then(function(res){
      if(res&&res.status==='success'&&res.sessionToken){SESSION_TOKEN=res.sessionToken;document.getElementById('loginCard').style.display='none';setStatus('로그인 성공. 스캔하세요.','ok');startCamera();}
      else setStatus((res&&res.message)||'로그인 실패','err');
    }).catch(function(e){setStatus(e.message,'err');});
  };

  document.getElementById('logoutBtn').onclick=function(){ SESSION_TOKEN=''; CURRENT_TOKEN=''; document.getElementById('loginCard').style.display='block'; setStatus('로그아웃 완료','ok'); };

  document.getElementById('markBtn').onclick=function(){
    if(!SESSION_TOKEN||!CURRENT_TOKEN){setStatus('세션 또는 토큰이 없습니다.','err');return;}
    setStatus('지급 처리 중…');
    jsonp({action:'markDeliveredFast',sessionToken:SESSION_TOKEN,verifyToken:CURRENT_TOKEN}).then(function(res){
      if(res&&res.status==='success'){
        setStatus('지급 완료 기록되었습니다.','ok');
        showResult({
          studentId: res.studentId || document.getElementById('rStudent').textContent,
          studentName: res.studentName || document.getElementById('rName').textContent,
          prize: res.prize || document.getElementById('rPrize').textContent,
          delivered: true
        });
      }
      else if(res&&res.status==='duplicate'){
        setStatus(res.message,'err');
        showResult({
          studentId: res.studentId || document.getElementById('rStudent').textContent,
          studentName: res.studentName || document.getElementById('rName').textContent,
          prize: res.prize || document.getElementById('rPrize').textContent,
          delivered: true
        });
      }
      else setStatus((res&&res.message)||'처리 실패','err');
    }).catch(function(e){setStatus(e.message,'err');});
  };

  document.getElementById('nextBtn').onclick=function(){
    CURRENT_TOKEN=''; lastScan=''; scanned=false;
    document.getElementById('result').style.display='none';
    setStatus('다음 QR을 스캔해 주세요.','ok');
    startCamera();
  };

  document.getElementById('retryBtn').onclick=startCamera;

  loadLocal();
  startCamera();
</script>
</body>
</html>
