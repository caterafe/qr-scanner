<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a5f4a">
  <title>QR 스캐너</title>
  <style>
    :root {
      --primary: #1a5f4a;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif;
      background: #0f172a;
      color: #fff;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: calc(16px + var(--safe-top)) 16px calc(16px + var(--safe-bottom));
    }
    h1 { font-size: 1.1rem; font-weight: 700; margin-bottom: 6px; color: #a7f3d0; }
    p.sub { font-size: .85rem; color: #94a3b8; margin-bottom: 20px; }

    .frame-wrap {
      position: relative;
      width: min(90vw, 320px);
      aspect-ratio: 1;
      border-radius: 16px;
      overflow: hidden;
      border: 3px solid #1a5f4a;
      background: #000;
    }
    video {
      display: block;
      width: 100%; height: 100%;
      object-fit: cover;
    }
    /* 모서리 가이드 */
    .corner {
      position: absolute;
      width: 28px; height: 28px;
      border-color: #fff;
      border-style: solid;
      border-width: 0;
      opacity: .9;
    }
    .corner.tl { top: 14px; left: 14px; border-top-width: 3px; border-left-width: 3px; border-radius: 4px 0 0 0; }
    .corner.tr { top: 14px; right: 14px; border-top-width: 3px; border-right-width: 3px; border-radius: 0 4px 0 0; }
    .corner.bl { bottom: 14px; left: 14px; border-bottom-width: 3px; border-left-width: 3px; border-radius: 0 0 0 4px; }
    .corner.br { bottom: 14px; right: 14px; border-bottom-width: 3px; border-right-width: 3px; border-radius: 0 0 4px 0; }

    /* 스캔 라인 애니메이션 */
    .scan-line {
      position: absolute;
      left: 14px; right: 14px;
      height: 2px;
      background: linear-gradient(to right, transparent, #34d399, transparent);
      animation: scanMove 2s ease-in-out infinite;
    }
    @keyframes scanMove {
      0%   { top: 14px; opacity: 1; }
      50%  { top: calc(100% - 14px); opacity: 1; }
      100% { top: 14px; opacity: 1; }
    }

    #status {
      margin-top: 18px;
      font-size: .9rem;
      color: #94a3b8;
      text-align: center;
      min-height: 2.4em;
      line-height: 1.5;
      white-space: pre-line;
    }
    #status.ok  { color: #34d399; }
    #status.err { color: #f87171; }

    .btn {
      margin-top: 16px;
      padding: 12px 28px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      background: var(--primary);
      color: #fff;
      display: none;
    }
    .btn.show { display: inline-block; }

    canvas { display: none; }
  </style>
</head>
<body>
  <h1>확인자 QR 스캐너</h1>
  <p class="sub">학생 화면의 QR코드를 화면에 비춰 주세요</p>

  <div class="frame-wrap">
    <video id="video" playsinline webkit-playsinline muted autoplay></video>
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
    <div class="scan-line" id="scanLine"></div>
  </div>
  <canvas id="canvas"></canvas>

  <div id="status">카메라를 시작하는 중…</div>
  <button id="retryBtn" class="btn" onclick="startCamera()">다시 시도</button>

  <script>
    // ── jsQR 로드 ──
    var jsQrReady = false;
    var pendingStart = false;
    (function(){
      var s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js';
      s.onload = function(){ jsQrReady = true; if(pendingStart) beginDecode(); };
      s.onerror = function(){ setStatus('QR 라이브러리 로드 실패.\n네트워크를 확인하고 새로고침해 주세요.', 'err'); };
      document.head.appendChild(s);
    })();

    var video   = document.getElementById('video');
    var canvas  = document.getElementById('canvas');
    var ctx     = canvas.getContext('2d');
    var rafId   = 0;
    var scanned = false;
    var stream  = null;

    function setStatus(msg, cls) {
      var el = document.getElementById('status');
      el.textContent = msg;
      el.className = cls || '';
    }

    function startCamera() {
      document.getElementById('retryBtn').classList.remove('show');
      scanned = false;
      document.getElementById('scanLine').style.display = 'block';

      if(stream){ stream.getTracks().forEach(function(t){ t.stop(); }); stream = null; }
      cancelAnimationFrame(rafId);

      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
        setStatus('이 브라우저는 카메라를 지원하지 않습니다.', 'err');
        return;
      }

      setStatus('카메라 권한을 요청하는 중…');

      var constraints = [
        { video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false },
        { video: { facingMode: { ideal: 'environment' } }, audio: false },
        { video: { facingMode: 'environment' }, audio: false },
        { video: true, audio: false }
      ];

      function tryNext(i, lastErr) {
        if(i >= constraints.length){
          onCameraError(lastErr || new Error('카메라를 시작할 수 없습니다'));
          return;
        }
        navigator.mediaDevices.getUserMedia(constraints[i])
          .then(onStream)
          .catch(function(e){ tryNext(i + 1, e); });
      }
      tryNext(0);
    }

    function onStream(s) {
      stream = s;
      video.srcObject = s;
      video.load();
      video.play()
        .then(function(){
          setStatus('QR을 화면 안에 맞춰 주세요');
          if(jsQrReady) beginDecode();
          else pendingStart = true;
        })
        .catch(function(e){ onCameraError(e); });
    }

    function onCameraError(err) {
      var name = err && err.name ? err.name : '';
      var msg = '';
      if(name === 'NotAllowedError' || name === 'PermissionDeniedError'){
        msg = '카메라 권한이 거부되었습니다.\n\n'
            + 'Safari 주소창 왼쪽 AA → 웹사이트 설정\n'
            + '→ 카메라 → 허용\n\n'
            + '설정 후 아래 버튼을 눌러 주세요.';
      } else if(name === 'NotFoundError'){
        msg = '카메라를 찾을 수 없습니다.';
      } else if(name === 'NotReadableError'){
        msg = '카메라가 다른 앱에서 사용 중입니다.\n다른 앱을 닫고 다시 시도해 주세요.';
      } else {
        msg = '카메라 오류: ' + (name || err.message || '알 수 없음');
      }
      setStatus(msg, 'err');
      document.getElementById('retryBtn').classList.add('show');
    }

    function beginDecode() {
      if(!jsQrReady || !video) return;
      (function tick(){
        rafId = requestAnimationFrame(tick);
        if(scanned) return;
        if(video.readyState < 2) return;
        var w = video.videoWidth, h = video.videoHeight;
        if(!w || !h) return;
        canvas.width = w; canvas.height = h;
        ctx.drawImage(video, 0, 0, w, h);
        var imgData = ctx.getImageData(0, 0, w, h);
        var code = jsQR(imgData.data, w, h, { inversionAttempts: 'dontInvert' });
        if(code && code.data){
          handleQr(code.data);
        }
      })();
    }

    function handleQr(raw) {
      // 유효한 GAS 앱 URL인지 확인 (?v= 파라미터 포함)
      var token = extractToken(raw);
      if(!token) return; // 관계없는 QR 무시

      scanned = true;
      cancelAnimationFrame(rafId);
      document.getElementById('scanLine').style.display = 'none';

      setStatus('인식 완료! 이동 중…', 'ok');

      // 스트림 정지 (배터리 절약)
      if(stream){ stream.getTracks().forEach(function(t){ t.stop(); }); stream = null; }

      // 즉시 이동 (클릭 불필요)
      setTimeout(function(){ window.location.href = raw; }, 400);
    }

    function extractToken(text) {
      var t = String(text || '').trim();
      var m = t.match(/[?&]v=([^&\s#]+)/i);
      if(m) return m[1];
      return '';
    }

    // 페이지 로드 시 바로 카메라 시작
    startCamera();
  </script>
</body>
</html>
